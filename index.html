<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ルーレット</title>
<meta name="theme-color" content="#f4f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ルーレット">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --line: #e2e0d8;
    --text: #222222;
    --muted: #7a776e;
    --btn: #222222;
    --btn-text: #ffffff;
    --on: #2f7d5b;
    --on-bg: #e6f3ec;
    --danger: #c8443a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161616;
      --surface: #222222;
      --line: #353535;
      --text: #eeeeee;
      --muted: #9a9a9a;
      --btn: #eeeeee;
      --btn-text: #161616;
      --on: #6fcf9f;
      --on-bg: #1d3329;
      --danger: #ff7a6e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  main { max-width: 440px; margin: 0 auto; }
  .wheel-wrap { width: min(92vw, 400px); margin: 0 auto; aspect-ratio: 1 / 1; }
  canvas#wheel { width: 100%; height: 100%; display: block; }
  .result { text-align: center; font-size: 30px; font-weight: 800; min-height: 42px; margin: 6px 0 0; overflow-wrap: anywhere; }
  .odds { text-align: center; font-size: 13px; color: var(--muted); margin: 2px 0 12px; min-height: 18px; }
  .spin {
    display: block; width: 100%; padding: 16px; font-size: 20px; font-weight: 700;
    color: var(--btn-text); background: var(--btn); border: none; border-radius: 14px;
  }
  .spin:active { opacity: .8; }
  .spin:disabled { opacity: .4; }

  section { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h2 { font-size: 16px; margin: 0; }
  .count { font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chip {
    display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 10px;
    border-radius: 10px; border: 1px solid var(--line); color: var(--muted); font-size: 15px;
  }
  .chip .dot { flex: none; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); }
  .chip .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.on { border-color: var(--on); background: var(--on-bg); color: var(--text); }
  .chip.on .dot { background: var(--on); border-color: var(--on); }
  .chip .del {
    display: none; flex: none; width: 28px; height: 28px; border-radius: 50%; border: none;
    background: var(--danger); color: #fff; font-size: 16px; line-height: 28px; padding: 0;
  }
  .editing .chip .del { display: block; }
  .editing .chip .dot { display: none; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 14px; padding: 12px 0; }

  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row input {
    flex: 1; min-width: 0; font-size: 16px; padding: 11px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    -webkit-user-select: text; user-select: text;
  }
  .btn {
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; font-size: 15px; font-weight: 600;
    background: var(--surface); color: var(--text); white-space: nowrap;
  }
  .btn.primary { background: var(--btn); color: var(--btn-text); border-color: var(--btn); }
  .row.tools .btn { flex: 1; padding: 10px 6px; font-size: 14px; }
  .msg { font-size: 13px; color: var(--danger); min-height: 18px; margin: 6px 0 0; }

  .history { list-style: none; margin: 10px 0 0; padding: 0; }
  .history li { display: flex; align-items: baseline; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--line); font-size: 16px; }
  .history li:first-child { border-top: none; font-weight: 700; }
  .history .no { width: 1.6em; color: var(--muted); font-size: 13px; text-align: right; }
  .history .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .history .tm { color: var(--muted); font-size: 13px; }
  .small { font-size: 13px; padding: 6px 12px; }
</style>
</head>
<body>
<main>
  <div class="wheel-wrap"><canvas id="wheel"></canvas></div>
  <p class="result" id="result"></p>
  <p class="odds" id="odds"></p>
  <button class="spin" id="spinBtn" type="button">まわす</button>

  <section>
    <div class="head">
      <h2>最近の結果</h2>
      <button class="btn small" type="button" id="resetBtn">リセット</button>
    </div>
    <ol class="history" id="history"></ol>
  </section>

  <section id="members">
    <div class="head">
      <h2>メンバー</h2>
      <span class="count" id="count"></span>
    </div>
    <p class="hint" id="hint"></p>
    <div class="grid" id="grid"></div>
    <form class="row" id="addForm" autocomplete="off">
      <input id="nameInput" type="text" maxlength="12" placeholder="名前を追加" enterkeyhint="done">
      <button class="btn primary" type="submit">追加</button>
    </form>
    <p class="msg" id="msg"></p>
    <div class="row tools">
      <button class="btn" type="button" id="allOn">全員参加</button>
      <button class="btn" type="button" id="allOff">全員休み</button>
      <button class="btn" type="button" id="editBtn">登録を消す</button>
    </div>
  </section>
</main>

<!-- 更新したら v= の数字を上げる。古いファイルがブラウザに残って動かなくなるのを防ぐ -->
<script src="logic.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
