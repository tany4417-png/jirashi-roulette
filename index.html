<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>じらしルーレット</title>
<meta name="theme-color" content="#16132e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ルーレット">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #16132e;
    --bg2: #221d45;
    --panel: #2a2452;
    --line: #3d3670;
    --text: #f5f1ff;
    --muted: #a69fcf;
    --gold: #f1c04f;
    --gold-dark: #b9851f;
    --accent: #ff5d73;
    --accent-dark: #d43a52;
    --on: #7ee0b2;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    min-height: 100vh;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
    background: radial-gradient(120% 60% at 50% 0%, #2f2766 0%, var(--bg) 60%);
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  main { max-width: 440px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 4px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .04em; }
  h1 span { color: var(--gold); }
  .icon-btn {
    border: 1px solid var(--line); background: var(--bg2); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font-size: 14px;
  }
  .wheel-wrap { position: relative; width: min(88vw, 380px); margin: 8px auto 0; aspect-ratio: 1 / 1; }
  canvas#wheel { width: 100%; height: 100%; display: block; }
  .status { text-align: center; min-height: 26px; margin: 6px 0 0; font-size: 17px; font-weight: 700; color: var(--gold); }
  .odds { text-align: center; font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
  .spin {
    display: block; width: 100%; padding: 18px; font-size: 22px; font-weight: 800; letter-spacing: .1em;
    color: #fff; background: linear-gradient(180deg, var(--accent), var(--accent-dark));
    border: none; border-radius: 18px; box-shadow: 0 6px 0 #8f2236, 0 10px 24px rgba(0,0,0,.35);
  }
  .spin:active { transform: translateY(3px); box-shadow: 0 3px 0 #8f2236, 0 6px 16px rgba(0,0,0,.35); }
  .spin:disabled { filter: grayscale(.6) brightness(.8); }
  .modes { display: flex; gap: 6px; margin: 14px 0 0; background: var(--bg2); padding: 4px; border-radius: 14px; }
  .modes button {
    flex: 1; border: none; background: transparent; color: var(--muted); font-size: 14px; font-weight: 700;
    padding: 9px 4px; border-radius: 10px;
  }
  .modes button[aria-pressed="true"] { background: var(--gold); color: #2a1f00; }
  .history { font-size: 13px; color: var(--muted); margin: 12px 2px 0; min-height: 18px; overflow-wrap: anywhere; }
  .history button { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 13px; padding: 0 0 0 6px; }

  section.members { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
  .mem-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .mem-head h2 { font-size: 16px; margin: 0; }
  .count { font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chip {
    position: relative; display: flex; align-items: center; gap: 8px; min-height: 46px;
    padding: 8px 10px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg2);
    color: var(--muted); font-size: 15px; text-align: left; width: 100%;
  }
  .chip .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
  .chip .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.on { border-color: var(--on); color: var(--text); background: #1f3a3a; }
  .chip.on .dot { background: var(--on); border-color: var(--on); }
  .chip .del {
    display: none; flex: none; width: 28px; height: 28px; border-radius: 50%; border: none;
    background: var(--accent); color: #fff; font-size: 16px; line-height: 28px; padding: 0;
  }
  .editing .chip .del { display: block; }
  .editing .chip .dot { display: none; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 14px; padding: 14px 0; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row input {
    flex: 1; min-width: 0; font-size: 16px; padding: 12px; border-radius: 12px;
    border: 1.5px solid var(--line); background: var(--bg); color: var(--text);
    -webkit-user-select: text; user-select: text;
  }
  .row input::placeholder { color: #6f68a0; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 700;
    background: var(--gold); color: #2a1f00; white-space: nowrap;
  }
  .btn.sub { background: var(--bg2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .row.tools .btn { flex: 1; padding: 10px 6px; font-size: 14px; }
  .msg { font-size: 13px; color: var(--accent); min-height: 18px; margin-top: 6px; }

  /* 結果 */
  .overlay {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(10, 8, 25, .72); z-index: 10; padding: 24px; overflow: hidden;
  }
  .overlay.show { display: flex; }
  .card {
    position: relative; z-index: 2; width: 100%; max-width: 360px; text-align: center;
    background: linear-gradient(180deg, #fff8e6, #ffe9b8); color: #2b2100; border-radius: 22px;
    padding: 26px 20px 20px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: pop .45s cubic-bezier(.2, 1.6, .4, 1);
  }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card .label { font-size: 15px; font-weight: 700; color: #8a6400; }
  .card .winner { font-size: 40px; font-weight: 900; margin: 8px 0 18px; overflow-wrap: anywhere; line-height: 1.2; }
  .card .actions { display: flex; flex-direction: column; gap: 8px; }
  .card .actions .btn { width: 100%; padding: 14px; font-size: 16px; }
  .card .actions .btn.main { background: var(--accent); color: #fff; }
  .card .actions .btn.sub { background: transparent; color: #6b5200; border: 1.5px solid #d9b25c; }
  .confetti { position: absolute; top: -20px; width: 9px; height: 14px; z-index: 1; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>じらし<span>ルーレット</span></h1>
    <button class="icon-btn" id="soundBtn" type="button">音 ON</button>
  </header>

  <div class="wheel-wrap"><canvas id="wheel"></canvas></div>
  <p class="status" id="status"></p>
  <p class="odds" id="odds"></p>

  <button class="spin" id="spinBtn" type="button">まわす</button>

  <div class="modes" id="modes" role="group" aria-label="じらし具合">
    <button type="button" data-mode="normal">ふつう</button>
    <button type="button" data-mode="tease">じらす</button>
    <button type="button" data-mode="super">すごくじらす</button>
  </div>

  <p class="history" id="history"></p>

  <section class="members" id="members">
    <div class="mem-head">
      <h2>メンバー</h2>
      <span class="count" id="count"></span>
    </div>
    <p class="hint" id="hint">タップで参加と休みを切り替えます。緑が参加中です。</p>
    <div class="grid" id="grid"></div>
    <form class="row" id="addForm" autocomplete="off">
      <input id="nameInput" type="text" maxlength="12" placeholder="名前を追加" enterkeyhint="done">
      <button class="btn" type="submit">追加</button>
    </form>
    <p class="msg" id="msg"></p>
    <div class="row tools">
      <button class="btn sub" type="button" id="allOn">全員参加</button>
      <button class="btn sub" type="button" id="allOff">全員休み</button>
      <button class="btn sub" type="button" id="editBtn">登録を消す</button>
    </div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="label">決まったのは</div>
    <div class="winner" id="winnerName"></div>
    <div class="actions">
      <button class="btn main" type="button" id="againBtn">もう一回</button>
      <button class="btn sub" type="button" id="removeWinnerBtn">この人を休みにしてもう一回</button>
      <button class="btn sub" type="button" id="closeBtn">閉じる</button>
    </div>
  </div>
</div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
